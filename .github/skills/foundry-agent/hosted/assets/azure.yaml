# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: {{AGENT_NAME}}
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: {{MODEL}}
              model:
                  format: OpenAI
                  name: {{MODEL}}
                  version: "{{MODEL_VERSION}}"
              sku:
                  name: GlobalStandard
                  capacity: 100
    {{AGENT_NAME}}:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        kind: hosted
        name: {{AGENT_NAME}}
        description: {{AGENT_DESCRIPTION}}
        codeConfiguration:
            runtime: python_3_13
            entryPoint: main.py
            dependencyResolution: remote_build
        container:
            resources:
                cpu: "{{CPU}}"
                memory: {{MEMORY}}
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        protocols:
            - protocol: responses
              version: 1.0.0
