name: Deploy azure-service-advisor

# CI/CD for azure-service-advisor, a *declarative* Foundry prompt agent. There is no image build — the
# deploy publishes a new agent version through the Foundry Agents data-plane REST API.
#
# Pipeline: deploy-dev -> eval (gate) -> deploy-demo. The eval job runs the Foundry evaluation suite
# against the freshly deployed dev agent and blocks promotion if any gating metric misses threshold.
#
# When evals=no, delete the `eval` job and change deploy-demo's `needs:` to `deploy-dev`.

on:
  push:
    branches:
      - main
    paths:
      - "src/agents/azure-service-advisor/**"
      - ".github/workflows/deploy-azure-service-advisor.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy azure-service-advisor (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: src/agents/azure-service-advisor
    env:
      # Read by scripts/deploy-agent.ps1. Set these per environment; deployment fails if required.
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy prompt agent (idempotent)
        shell: pwsh
        run: ./scripts/deploy-agent.ps1

  eval:
    name: Eval gate (dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: src/agents/azure-service-advisor/evals
    env:
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AGENT_NAME: azure-service-advisor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Foundry evaluation against dev (CI gate)
        run: python run_evaluation.py --mode ci --dataset ci-smoke.jsonl

      - name: Upload results snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-service-advisor-eval-results
          path: src/agents/azure-service-advisor/evals/results/*.json
          retention-days: 30

  deploy-demo:
    name: Deploy azure-service-advisor (demo)
    needs: eval
    runs-on: ubuntu-latest
    environment: demo
    defaults:
      run:
        working-directory: src/agents/azure-service-advisor
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy prompt agent (idempotent)
        shell: pwsh
        run: ./scripts/deploy-agent.ps1
