# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Hosted agent (Agent Framework, Responses 2.0.0): human-in-the-loop review, SCBX shape.
# Behaviour ported from foundry-samples langgraph/responses/07-human-in-the-loop (MIT) to Agent Framework.
# Models come from the AI Gateway; no model deployment here. See templates/_gateway/GATEWAY-CONTRACT.md.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: scbx-hosted-human-in-the-loop
services:
  ai-project:
    host: azure.ai.project
  scbx-hosted-human-in-the-loop:
    host: azure.ai.agent
    project: src/agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: scbx-hosted-human-in-the-loop
    displayName: SCBX Hosted Agent (Human in the Loop)
    description: Agent Framework workflow that drafts a proposal, pauses for human review, and supports approve, revise and reject.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      GATEWAY_MODELS_BASE_URL: ${GATEWAY_MODELS_BASE_URL}
      GATEWAY_MODEL_NAME: ${GATEWAY_MODEL_NAME}
      GATEWAY_TOKEN_SCOPE: ${GATEWAY_TOKEN_SCOPE}
      # Keep prompts and drafts out of traces (R7). Both lines are needed; see ../observability/README.md.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      ENABLE_SENSITIVE_DATA: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
