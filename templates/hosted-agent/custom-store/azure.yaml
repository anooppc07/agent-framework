# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Hosted agent (Agent Framework, Responses 2.0.0) with custom Redis-backed stores, SCBX shape. Adapted from
# microsoft-foundry/foundry-samples (MIT) agent-framework/responses/26-custom-store.
# Differences: model comes from the AI Gateway (no deployment here); Redis is private (infra/redis/main.bicep).
# EXCEPTION: Redis is not in the Foundry landing-zone baseline; see templates/_gateway/GATEWAY-CONTRACT.md.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: scbx-hosted-custom-store
services:
  ai-project:
    host: azure.ai.project
  scbx-hosted-custom-store:
    host: azure.ai.agent
    project: src/agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: scbx-hosted-custom-store
    displayName: SCBX Hosted Agent (Custom Store)
    description: Agent Framework agent whose responses, sessions, checkpoints and approvals live in a private Redis the PortCo owns; model calls go through the AI Gateway.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      GATEWAY_MODELS_BASE_URL: ${GATEWAY_MODELS_BASE_URL}
      GATEWAY_MODEL_NAME: ${GATEWAY_MODEL_NAME}
      GATEWAY_TOKEN_SCOPE: ${GATEWAY_TOKEN_SCOPE}
      # The redis layer exports these; the post-deploy hook grants the agent identity access.
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_RESPONSE_TTL_SECONDS: ${REDIS_RESPONSE_TTL_SECONDS=86400}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      ENABLE_SENSITIVE_DATA: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: hooks/Set-RedisAgentAccess.ps1
    posix:
      shell: sh
      run: hooks/postdeploy.sh
infra:
  layers:
    - provider: microsoft.foundry
      path: infra/foundry
      name: foundry
    - provider: bicep
      path: infra/redis
      name: redis
      dependsOn:
        - foundry
