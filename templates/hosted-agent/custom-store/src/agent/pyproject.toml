[project]
name = "scbx-hosted-custom-store"
version = "0.1.0"
description = "SCBX hosted agent (Agent Framework, Responses) with Redis-backed response, session, checkpoint and approval stores. Models via the AI Gateway."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry==1.16.1",
    "agent-framework-foundry-hosting==1.0.0b261106",
    "opentelemetry-instrumentation-httpx",
    "azure-identity",
    "python-dotenv",
    "redis>=5.0",
    "redis-entraid>=1.2,<2",
]
