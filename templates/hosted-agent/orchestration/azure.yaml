# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Hosted agent (Agent Framework, Responses 2.0.0): sequential chain or group chat, SCBX shape.
# Hosting shape adapted from microsoft-foundry/foundry-samples (MIT). The orchestration itself is original:
# no foundry-samples sample hosts a sequential or group-chat workflow (see docs/handoff/HANDOFF.md).
# Models come from the AI Gateway; no model deployment here. See templates/_gateway/GATEWAY-CONTRACT.md.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: scbx-hosted-orchestration
services:
  ai-project:
    host: azure.ai.project
  scbx-hosted-orchestration:
    host: azure.ai.agent
    project: src/agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: scbx-hosted-orchestration
    displayName: SCBX Hosted Agent (Orchestration)
    description: Agent Framework orchestration (sequential chain or group chat). Each agent keeps its own session; the orchestrator forwards the conversation.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      GATEWAY_MODELS_BASE_URL: ${GATEWAY_MODELS_BASE_URL}
      GATEWAY_MODEL_NAME: ${GATEWAY_MODEL_NAME}
      GATEWAY_TOKEN_SCOPE: ${GATEWAY_TOKEN_SCOPE}
      ORCHESTRATION_PATTERN: sequential   # or: group-chat
      # Keep prompts and drafts out of traces (R7). Both lines are needed; see ../observability/README.md.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      ENABLE_SENSITIVE_DATA: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
