[project]
name = "poc-local-agent-evals"
version = "0.1.0"
description = "Foundry evaluation suite for the poc-local-agent agent."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
